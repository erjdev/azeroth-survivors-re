# The pull-request gate. Upstream benilla runs no CI and never builds the wasm target, so a
# wasm-only break (a tuple that became a struct, a std::time::Instant) is invisible to it and to a
# native `cargo check` here. This is where it is caught before it reaches `main`.
#
# The wasm target is checked; browser/host tests and targeted client-carry tests
# catch behavior regressions after upstream merges. These need no game data. The
# full workspace test suite needs a 1.12.1 patch chain and is not run here.
name: check
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-survivors:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Windows launcher exit codes and data paths
        run: python -m unittest discover -s scripts -p test_survivors_launchers.py -v
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-survivors
      - name: native Survivors launcher and feature carries
        run: cargo check -p warcraft-survivors
      - name: Survivors rules
        run: cargo test --locked --profile play -p survivors-core
      - name: link Windows player executable
        run: cargo build --locked --profile play -p warcraft-survivors --no-default-features
      - name: upload Windows playtest executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: survivors-windows-${{ github.sha }}
          path: target/play/warcraft-survivors.exe
          if-no-files-found: error
          retention-days: 7
      # This gate needs no install data or GPU. Live foliage and navigation
      # acceptance still requires an attended Windows playtest.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
          cache-directories: tools
      # wasi-sdk is the C sysroot the Lua VM's build script needs even for `cargo check`; the
      # script also installs wasm-bindgen-cli at Cargo.lock's exact version, which `check` does
      # not use but a later `web-build.sh` step would. Both land under tools/ and ~/.cargo/bin,
      # which the cache above keeps.
      - name: toolchain (scripts/web-setup.sh)
        run: scripts/web-setup.sh
      - name: cargo check, wasm32
        run: cargo check --target wasm32-unknown-unknown -p wenilla --no-default-features --features webgpu
  host-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: host
      - name: isolated Survivors UI fixtures
        run: python3 -m unittest discover -s scripts -p test_survivors_ui_fixture.py -v
      - name: documentation gate failure handling
        run: python3 -m unittest discover -s scripts -p test_doc_links.py -v
      - name: browser build profiles
        run: python3 -m unittest discover -s scripts -p test_web_build.py -v
      - name: browser startup and journal regressions
        run: node --test web/tests/*.test.mjs
      - name: host cache and relay regressions
        run: cargo test -p wenilla-host
      - name: UI listener ordering and mutation
        run: |
          cargo test -p benilla-ui --lib script::tests::events
          cargo test -p benilla-ui --lib wenilla_listener
  client-carries:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: client-carries
      - name: native Bevy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Compare the small carry against upstream's original math after every merge.
      - name: rig composition equivalence and browser budget
        run: |
          cargo test -p benilla-world --lib rig_anim::compose --no-default-features
          cargo test -p benilla-world --lib web_budget --no-default-features
      - name: Survivors rules and visibility integration
        run: |
          cargo test -p benilla-world --lib --features survivors-visibility survivors_visibility
          cargo test -p survivors-core
          cargo survivors-test
